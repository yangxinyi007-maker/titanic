  <div class="inner">
  <h2 class="calc-title">存活率测算</h2>

  <main>
    <section class="panel" aria-labelledby="t-in">
      <h2 id="t-in">乘客信息</h2>

      <div class="field">
        <span class="lab" id="lab-class">舱位等级</span>
        <div class="seg" role="radiogroup" aria-labelledby="lab-class">
          <input type="radio" name="pclass" id="c1" value="1"><label for="c1">一等舱</label>
          <input type="radio" name="pclass" id="c2" value="2"><label for="c2">二等舱</label>
          <input type="radio" name="pclass" id="c3" value="3" checked><label for="c3">三等舱</label>
        </div>
      </div>

      <div class="field">
        <span class="lab" id="lab-sex">性别</span>
        <div class="seg" role="radiogroup" aria-labelledby="lab-sex">
          <input type="radio" name="sex" id="sf" value="0" checked><label for="sf">女</label>
          <input type="radio" name="sex" id="sm" value="1"><label for="sm">男</label>
        </div>
      </div>

      <div class="field">
        <label for="age">年龄</label>
        <div class="age-row">
          <input type="range" id="age-range" min="1" max="80" value="28" aria-label="年龄滑块">
          <input type="number" id="age" min="1" max="80" value="28">
        </div>
      </div>

      <div class="field">
        <label for="port">出发港（可选）</label>
        <select id="port">
          <option value="">不指定</option>
          <option value="0">法国 瑟堡</option>
          <option value="1">爱尔兰 皇后镇</option>
          <option value="2">英国 南安普敦</option>
        </select>
        <p class="hint">所有乘客的目的地都是纽约，所以到达地不作为变量。</p>
      </div>
    </section>

    <section class="panel result" aria-live="polite" aria-labelledby="t-out">
      <h2 id="t-out">估算存活率</h2>
      <div class="big"><span id="rate">--</span><small>%</small></div>
      <p class="verdict" id="verdict"></p>

      <div class="meter" id="meter">
        <div class="fill" id="fill"></div>
        <div class="ci" id="ci"></div>
        <div class="avg" id="avg"><span id="avg-label"></span></div>
      </div>
      <div class="scale"><span>0%</span><span>50%</span><span>100%</span></div>

      <p class="basis" id="basis"></p>

      <div class="table-scroll">
        <table>
          <thead><tr><th>舱位 · 性别</th><th>乘客</th><th>存活</th><th>存活率</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <section class="roles" aria-labelledby="t-roles">
    <h2 id="t-roles">分工</h2>
    <dl>
      <dt>资料收集</dt><dd>杨心怡 周淼淼</dd>
      <dt>第一、二部分</dt><dd>张烨</dd>
      <dt>开头、第四部分、结尾互动链接</dt><dd>杨心怡</dd>
      <dt>第三、五部分</dt><dd>周淼淼</dd>
    </dl>
  </section>

  </div>

const BASE = [[1,0,144,139],[1,1,179,61],[2,0,106,94],[2,1,171,25],[3,0,216,106],[3,1,493,75]];   // [舱位, 性别, 乘客数, 存活数]
const TOTAL = {"n": 1309, "k": 500};

const $ = id => document.getElementById(id);
const CLS = {1: '一等舱', 2: '二等舱', 3: '三等舱'};
const SEX = {0: '女', 1: '男'};
const PORT = {0: '瑟堡', 1: '皇后镇', 2: '南安普敦'};
const MIN_N = 25;

function wilson(k, n) {
  const z = 1.96, p = k / n, d = 1 + z * z / n;
  const c = (p + z * z / (2 * n)) / d;
  const h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d;
  return [Math.max(0, c - h), Math.min(1, c + h)];
}

function match(cls, sex, age, port, w) {
  let n = 0, k = 0;
  for (const r of DATA) {
    if (r[0] !== cls || r[1] !== sex) continue;
    if (port !== null && r[3] !== port) continue;
    if (Math.abs(r[2] - age) > w) continue;
    n++; k += r[4];
  }
  return {n, k};
}

function estimate(cls, sex, age, port) {
  let usedPort = port, note = '';
  for (let pass = 0; pass < 2; pass++) {
    for (let w = 3; w <= 25; w += 2) {
      const m = match(cls, sex, age, usedPort, w);
      if (m.n >= MIN_N) return {...m, w, port: usedPort, note};
    }
    if (usedPort !== null) {
      usedPort = null;
      note = '所选出发港的相似乘客太少，已忽略出发港重新匹配。';
    } else break;
  }
  const m = match(cls, sex, age, null, 200);
  return {...m, w: null, port: null, note: note || '该组合的乘客较少，已使用同舱位同性别的全部年龄。'};
}

function tone(p) { return p >= 0.6 ? 'var(--high)' : p >= 0.35 ? 'var(--mid)' : 'var(--low)'; }
function verdictText(p) {
  if (p >= 0.8) return '大概率获救';
  if (p >= 0.6) return '获救机会较大';
  if (p >= 0.4) return '生死各半';
  if (p >= 0.2) return '获救机会较小';
  return '大概率遇难';
}

function render() {
  let age = parseInt($('age').value, 10);
  if (!(age >= 1)) age = 1;
  if (age > 80) age = 80;
  const cls = +document.querySelector('input[name=pclass]:checked').value;
  const sex = +document.querySelector('input[name=sex]:checked').value;
  const pv = $('port').value;
  const port = pv === '' ? null : +pv;

  const e = estimate(cls, sex, age, port);
  const p = e.n ? e.k / e.n : 0;
  const [lo, hi] = e.n ? wilson(e.k, e.n) : [0, 1];

  $('rate').textContent = (p * 100).toFixed(1);
  $('rate').parentElement.style.color = tone(p);
  $('verdict').textContent = verdictText(p);
  const fill = $('fill');
  fill.style.width = (p * 100) + '%';
  fill.style.background = tone(p);
  $('ci').style.left = (lo * 100) + '%';
  $('ci').style.width = Math.max(0, (hi - lo) * 100) + '%';

  const avg = TOTAL.k / TOTAL.n;
  $('avg').style.left = (avg * 100) + '%';
  $('avg-label').textContent = '全体 ' + (avg * 100).toFixed(1) + '%';

  const ageTxt = e.w === null ? '全部年龄' : (Math.max(1, age - e.w) + '–' + (age + e.w) + ' 岁');
  const portTxt = e.port === null ? '' : ' · 从' + PORT[e.port] + '上船';
  $('basis').innerHTML =
    '参照 <b>' + e.n + '</b> 位相似乘客（' + CLS[cls] + ' · ' + SEX[sex] + ' · ' + ageTxt + portTxt + '），其中 <b>' + e.k + '</b> 人存活。' +
    '95% 区间约 ' + (lo * 100).toFixed(0) + '%–' + (hi * 100).toFixed(0) + '%，样本越少区间越宽。' +
    (e.note ? '<span class="note">' + e.note + '</span>' : '');

  $('tbody').innerHTML = BASE.map(r => {
    const on = r[0] === cls && r[1] === sex ? ' class="on"' : '';
    return '<tr' + on + '><td>' + CLS[r[0]] + ' · ' + SEX[r[1]] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td><td>' + (r[3] / r[2] * 100).toFixed(1) + '%</td></tr>';
  }).join('');
}

$('age-range').addEventListener('input', () => { $('age').value = $('age-range').value; render(); });
$('age').addEventListener('input', () => { const v = parseInt($('age').value, 10); if (v >= 1 && v <= 80) $('age-range').value = v; render(); });
document.querySelectorAll('input[name=pclass], input[name=sex]').forEach(el => el.addEventListener('change', render));
$('port').addEventListener('change', render);
render();
